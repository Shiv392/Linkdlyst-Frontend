        <!-- ================= URL INPUT ================= -->
        <form
          [formGroup]="shortenForm"
          (ngSubmit)="shortenUrl()"
          class="mt-9 flex max-w-2xl items-center rounded-xl border border-slate-200
                 bg-white p-1.5 shadow-[0_12px_40px_rgba(15,23,42,0.08)]
                 transition focus-within:border-red-300 focus-within:ring-4
                 focus-within:ring-red-50">

          <!-- Link Icon -->
          <div class="flex w-12 justify-center text-slate-400">
            <i class="pi pi-link"></i>
          </div>

          <!-- Input -->
          <app-common-input
            class="flex-1"
            formControlName="url"
            placeholder="Paste your long URL here..."
            ariaLabel="URL to shorten"
            inputClass="h-12 w-full border-0 bg-transparent px-2 text-sm text-slate-700 outline-none placeholder:text-slate-400">
          </app-common-input>

          <!-- Button -->
          <app-common-button
            type="submit"
            label="Shorten URL"
            icon="pi pi-bolt"
            buttonClass="flex h-12 items-center gap-2 rounded-lg bg-[#d64545] px-6 text-sm font-semibold text-white shadow-md shadow-red-100 transition-all duration-200 hover:-translate-y-0.5 hover:bg-[#c63b3b] active:translate-y-0">
          </app-common-button>

        </form>
