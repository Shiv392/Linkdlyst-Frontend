        <!-- ================= URL INPUT ================= -->
        <form
          [formGroup]="shortenForm"
          (ngSubmit)="shortenUrl()"
          class="mt-9 grid w-full max-w-3xl grid-cols-1 items-end gap-3 md:grid-cols-[minmax(0,0.8fr)_minmax(0,1.2fr)_auto]">

          <label class="block min-w-0">
            <span class="mb-1.5 block text-xs font-semibold text-slate-600">Link name <span class="text-[#d64545]" aria-hidden="true">*</span></span>
            <span class="flex h-12 min-w-0 items-center rounded-xl border border-slate-200 bg-white px-3 shadow-[0_8px_24px_rgba(15,23,42,0.05)] transition focus-within:border-red-300 focus-within:ring-4 focus-within:ring-red-50">
              <i class="pi pi-tag mr-2 text-sm text-slate-400" aria-hidden="true"></i>
              <app-common-input
                class="min-w-0 flex-1"
                formControlName="name"
                [maxLength]="50"
                placeholder="Campaign name"
                ariaLabel="Link name, required, maximum 50 characters"
                inputClass="h-10 w-full border-0 bg-transparent px-1 text-sm text-slate-700 outline-none placeholder:text-slate-400">
              </app-common-input>
            </span>
            @if (shortenForm.controls.name.touched && shortenForm.controls.name.invalid) {
              <span class="mt-1 block text-xs text-[#d64545]" role="alert">
                @if (shortenForm.controls.name.hasError('required')) {
                  Link name is required.
                } @else {
                  Link name must be 50 characters or fewer.
                }
              </span>
            }
          </label>

          <label class="block min-w-0">
            <span class="mb-1.5 block text-xs font-semibold text-slate-600">Destination URL <span class="text-[#d64545]" aria-hidden="true">*</span></span>
            <span class="flex h-12 min-w-0 items-center rounded-xl border border-slate-200 bg-white px-3 shadow-[0_8px_24px_rgba(15,23,42,0.05)] transition focus-within:border-red-300 focus-within:ring-4 focus-within:ring-red-50">
              <i class="pi pi-link mr-2 text-sm text-slate-400" aria-hidden="true"></i>
              <app-common-input
                class="min-w-0 flex-1"
                formControlName="url"
                placeholder="Paste your long URL here..."
                ariaLabel="Destination URL, required"
                inputClass="h-10 w-full border-0 bg-transparent px-1 text-sm text-slate-700 outline-none placeholder:text-slate-400">
              </app-common-input>
            </span>
            @if (shortenForm.controls.url.touched && shortenForm.controls.url.hasError('required')) {
              <span class="mt-1 block text-xs text-[#d64545]" role="alert">Destination URL is required.</span>
            }
          </label>

          <app-common-button
            class="w-full md:w-auto"
            type="submit"
            label="Shorten URL"
            icon="pi pi-bolt"
            buttonClass="flex h-12 w-full items-center justify-center gap-2 rounded-lg bg-[#d64545] px-5 text-sm font-semibold text-white shadow-md shadow-red-100 transition-all duration-200 hover:-translate-y-0.5 hover:bg-[#c63b3b] active:translate-y-0 md:w-auto">
          </app-common-button>

        </form>
