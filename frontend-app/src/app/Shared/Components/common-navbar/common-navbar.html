<header class="relative z-10 mx-auto flex h-20 max-w-7xl items-center justify-between px-5 sm:px-8">
	<a
		routerLink="/home"
		routerLinkActive
		#homeRoute="routerLinkActive"
		[routerLinkActiveOptions]="{ exact: true }"
		class="flex items-center gap-3 text-inherit no-underline"
		aria-label="LinkedList home">
		<span class="flex h-10 w-10 items-center justify-center rounded-xl bg-[#d64545] text-white shadow-lg shadow-red-200">
			<i class="pi pi-link text-lg" aria-hidden="true"></i>
		</span>

		<span>
			<span class="block text-xl font-bold tracking-tight">Linked<span class="text-[#d64545]">List</span></span>
			<span class="block text-[10px] font-medium uppercase tracking-[0.18em] text-slate-400">URL Intelligence</span>
		</span>
	</a>

	<nav class="hidden items-center gap-8 md:flex" aria-label="Main navigation">
		@for (link of links; track link.route) {
			<a
				[routerLink]="link.route"
				routerLinkActive="text-[#d64545]"
				[routerLinkActiveOptions]="{ exact: true }"
				ariaCurrentWhenActive="page"
				class="cursor-pointer text-sm font-medium text-slate-500 no-underline transition hover:text-[#d64545]">
				{{ link.label }}
			</a>
		}
	</nav>

	<div class="flex items-center gap-1 sm:gap-3">
		@if (!isLoggedIn()) {
			<a
				(click)="redirectLogin()"
				class="cursor-pointer rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 no-underline transition hover:bg-slate-100 sm:px-4">
				Login
			</a>
		} @else {
			<div class="group relative">
				<button
					type="button"
					class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-full border border-slate-200 bg-white text-slate-600 transition hover:border-red-200 hover:text-[#d64545] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-red-100"
					aria-label="Open profile menu"
					aria-haspopup="true">
					<i class="pi pi-user text-lg" aria-hidden="true"></i>
				</button>

				<p-menu
					[model]="profileMenuItems"
					aria-label="Profile menu"
					class="profile-menu invisible pointer-events-none absolute right-0 top-full z-50 w-64 opacity-0 transition duration-150 group-hover:pointer-events-auto group-hover:visible group-hover:opacity-100 group-focus-within:pointer-events-auto group-focus-within:visible group-focus-within:opacity-100">
					<ng-template #start>
						<div class="border-b border-slate-100 px-4 py-3">
							<p class="truncate text-sm font-semibold text-slate-800">{{ userName() || 'Account' }}</p>
							<p class="mt-0.5 truncate text-xs text-slate-500">{{ userEmail() || 'No email available' }}</p>
						</div>
					</ng-template>
				</p-menu>
			</div>
		}

		@if (homeRoute.isActive) {
			<app-common-button
				label="Get Started"
				(click)="redirectSignup()"
				buttonClass="rounded-lg bg-[#d64545] px-3 py-2.5 text-sm font-semibold text-white shadow-md shadow-red-200 transition duration-200 hover:-translate-y-0.5 hover:bg-[#c63b3b] cursor-pointer active:translate-y-0 sm:px-5">
			</app-common-button>
		}
	</div>
</header>

<nav class="mx-auto flex max-w-7xl items-center gap-6 px-5 pb-3 md:hidden" aria-label="Mobile navigation">
	@for (link of links; track link.route) {
		<a
			[routerLink]="link.route"
			routerLinkActive="text-[#d64545]"
			[routerLinkActiveOptions]="{ exact: true }"
			ariaCurrentWhenActive="page"
			class="cursor-pointer text-sm font-medium text-slate-500 no-underline transition hover:text-[#d64545]">
			{{ link.label }}
		</a>
	}
</nav>
